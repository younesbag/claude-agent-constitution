<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@500;600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0F171F}
.c{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:72px 84px;color:#E6EDF2;font-family:"IBM Plex Sans Arabic",sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.c::before{content:"";position:absolute;inset:28px;border:1px solid #243441;border-radius:18px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#93A4B3}
.stamp{display:inline-flex;align-items:center;gap:12px;color:#43C6A7;font-weight:600}
.stamp i{width:14px;height:14px;border-radius:50%;background:#43C6A7;display:inline-block}
h1{font-family:"Amiri",serif;font-weight:700;font-size:156px;line-height:1.2;margin:-18px 0 0;color:#fff}
.sub{font-size:40px;font-weight:500;color:#C9D5DE;margin:44px 0 0}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.chips{display:flex;gap:12px;direction:ltr}
.chips span{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;color:#DCE5EC;border:1px solid #33424F;border-radius:999px;padding:8px 20px}
.url{font-family:"IBM Plex Mono",monospace;font-size:22px;color:#93A4B3;direction:ltr}
</style>
</head>
<body>
<div class="c">
  <div class="top"><span class="stamp"><i></i>إطار مفتوح · الإصدار ١٫٠</span><span class="url">github.com/younesbag/claude-agent-constitution</span></div>
  <div>
    <h1>دستور الوكيل</h1>
    <p class="sub">عشرة مبادئ لملفات التعليمات، ونصٌّ جاهز يحدّثها بأمان</p>
  </div>
  <div class="bottom"><div class="chips"><span>CLAUDE.md</span><span>Fable 5.1</span><span>Opus 5.5</span></div></div>
</div>
</body>
</html>
