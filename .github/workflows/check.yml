name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  page-matches-prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: index.html is built from prompt/*.md
        run: python build.py --check
